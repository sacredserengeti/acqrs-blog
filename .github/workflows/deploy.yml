name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 42b2d98d9a78704a355c9a4f930c6065
  SITE_URL: https://blog.acqrs.co.uk
  # Accept either secret name so a naming slip in repo settings cannot silently break deploys.
  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY }}

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Cloudflare API token
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::No Cloudflare token secret found (expected CLOUDFLARE_API_TOKEN or CLOUDFLARE_API_KEY)."
            echo "Create a token with 'Account > Workers Scripts > Edit' for Mttypl@gmail.com's Account"
            echo "and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ "${#CF_TOKEN}" -lt 40 ]; then
            echo "::error::Token is only ${#CF_TOKEN} characters - that looks like a truncated paste or the Global API Key, not an API token."
            exit 1
          fi

      - name: Deploy static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.162.0"
          command: deploy

      - name: Smoke test
        run: |
          set -e
          for path in / /about /dtsearch /sitemap.xml /bl-content/uploads/bltsearch.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --retry 12 --retry-delay 5 --retry-all-errors \
              "$SITE_URL$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::Smoke test failed: $SITE_URL$path returned $code"
              exit 1
            fi
          done
          missing=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/this-page-does-not-exist")
          echo "/this-page-does-not-exist -> $missing (want 404)"
          [ "$missing" = "404" ]
